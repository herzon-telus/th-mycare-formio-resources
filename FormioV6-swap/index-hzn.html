<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form.io Existing Form POC</title>
    <!-- Form.io CSS -->
    <link rel="stylesheet" href="https://cdn.form.io/formiojs/formio.full.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Form.io JavaScript -->
    <script src="https://cdn.form.io/formiojs/formio.full.min.js"></script>
    <link rel="stylesheet" href="https://cdn.form.io/js/formio.form.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"/>
</head>
<body>
    <div id="formio"></div>

<script>
  const formUrl = 'https://form-io.preprod.babylonbytelushealth.com/qiedzdtecdtedeu/hznpocauth';
  const baseUrl = 'https://form-io.preprod.babylonbytelushealth.com/qiedzdtecdtedeu/';
  const projectUrl = 'https://form-io.preprod.babylonbytelushealth.com/qiedzdtecdtedeu';

  var OAUTH_TOKEN = 'PORTAL_TOKEN';
  OAUTH_TOKEN = 'bad_token_to_test_error_handling';


  var languages = {};
  var languageResourceGlobal = null;
  var languageResourceLocal  = null;

  /* -------------------------
     Utilities
  --------------------------*/
  function deepMerge(target, source) {
    for (let key in source) {
      if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
        if (!target[key]) target[key] = {};
        deepMerge(target[key], source[key]);
      } else {
        target[key] = source[key];
      }
    }
    return target;
  }

  async function fetchTranslations(resourceUrl, lang) {
    try {
      const resp = await Formio.fetch(resourceUrl + '/submission?data.language=' + lang);
      const result = await resp.json();
      if (!result || !result.length) return {};
      return result[0].data.translations || {};
    } catch (err) {
      console.error("Error loading translations:", resourceUrl, err);
      return {};
    }
  }

  async function setLanguage(lang) {
    if (!languageResourceLocal) {
      const translations = await fetchTranslations(languageResourceGlobal, lang);
      languages[lang] = translations;
      if (window.form) {
        form.addLanguage(lang, translations);
        form.language = lang;
        form.redraw();
      }
      return;
    }

    const [globalTranslations, localTranslations] = await Promise.all([
      fetchTranslations(languageResourceGlobal, lang),
      fetchTranslations(languageResourceLocal, lang)
    ]);

    const merged = deepMerge(globalTranslations, localTranslations);
    languages[lang] = merged;

    if (window.form) {
      form.addLanguage(lang, merged);
      form.language = lang;
      form.redraw();
    }
  }

  /* -------------------------
     TOKEN SWAP
  --------------------------*/
  async function doTokenSwap() {
    try {
      let headers = new Formio.Headers();
      console.log('Auth Token:', OAUTH_TOKEN);
      headers.set('Authorization', 'Bearer ' + OAUTH_TOKEN);

      Formio.setBaseUrl(projectUrl);
      Formio.setProjectUrl(projectUrl);

      //Formio.currentUser = null; // <-- HERE I WANT TO CLEAR/DELETE CACHED TOKEN, THIS LINE IS NOT WORKING
      //Formio.cache = {};         // <-- HERE I WANT TO CLEAR/DELETE CACHED TOKEN, THIS LINE IS NOT WORKING

      var formio = new Formio(projectUrl);
      let user = await formio.currentUser({
        external: true,
        header: headers
      });

      console.log('Token swap successful:', user);
      return user;
    } catch (err) {
      console.error('Token swap failed:', err);
      //throw err;
      return;
    }
  }

  /* -------------------------
     INITIALIZATION
  --------------------------*/
  async function initialize() {
    try {
      await doTokenSwap();

      const formInstance = await Formio.createForm(
        document.getElementById('formio'),
        formUrl
      );
      window.form = formInstance;

      const response = await fetch(formUrl);
      const data = await response.json();
      const tags = data.tags || [];

      if (!tags.length) {
        console.error('No tags found');
        return;
      }

      if (tags.length === 1) {
        languageResourceGlobal = baseUrl + tags[0];
      } else {
        languageResourceGlobal = baseUrl + tags[0];
        languageResourceLocal  = baseUrl + tags[1];
      }

      await setLanguage('en');
    } catch (err) {
      console.error('Initialization failed:', err);
    }
  }

  // Ejecutamos la inicialización
  initialize();
</script>


</body>
</html>
